<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intervallum teszt</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mut:#6b7488;--ac:#3b5bdb;--ok:#2b9348;--bad:#d62839;--bd:#d9deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mut:#9aa3b8;--ac:#7c93ff;--ok:#4cc46a;--bad:#ff6b78;--bd:#333b4f}}
:root[data-theme="dark"]{--bg:#12151d;--card:#1c212d;--tx:#e8ebf3;--mut:#9aa3b8;--ac:#7c93ff;--ok:#4cc46a;--bad:#ff6b78;--bd:#333b4f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
h1{font-size:1.5rem;margin:0 0 8px}
p{color:var(--mut);margin:0 0 16px}
input{width:100%;box-sizing:border-box;padding:12px;font-size:1rem;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:14px}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:600;width:100%}
a.btn{display:block;box-sizing:border-box;text-align:center;text-decoration:none;margin-top:6px}
.btn:disabled{opacity:.4;cursor:default}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 18px;overflow:hidden}
.bar div{height:100%;background:var(--ac);transition:width .3s}
.meta{color:var(--mut);font-size:.9rem;display:flex;justify-content:space-between}
.q{font-size:1.15rem;font-weight:600;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:2px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:1rem}
.opt.sel{border-color:var(--ac)}
.big{font-size:2.6rem;font-weight:700;text-align:center;margin:8px 0}
.row{display:flex;gap:12px;margin:14px 0}
.row div{flex:1;text-align:center;border-radius:12px;padding:14px;border:1px solid var(--bd)}
.row b{display:block;font-size:1.8rem}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.rev{border-top:1px solid var(--bd);padding:10px 0;font-size:.95rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="start" class="card">
  <h1>📐 Intervallum teszt</h1>
  <p>10 kérdés, kérdésenként 4 válasz, ebből 1 helyes.<br>Add meg a neved a kezdéshez!</p>
  <input id="name" placeholder="Neved" maxlength="40" autocomplete="name">
  <button class="btn" id="go" disabled>Kezdés</button>
</section>

<section id="quiz" class="card" hidden>
  <div class="meta"><span id="who"></span><span id="cnt"></span></div>
  <div class="bar"><div id="prog"></div></div>
  <div class="q" id="qt"></div>
  <div id="opts"></div>
  <button class="btn" id="next" disabled>Következő</button>
</section>

<section id="end" class="card" hidden>
  <h1 id="endname"></h1>
  <div class="big" id="score"></div>
  <div class="row">
    <div><b class="ok" id="good">0</b>helyes válasz</div>
    <div><b class="bad" id="wrong">0</b>helytelen válasz</div>
  </div>
  <a class="btn" href="https://forms.gle/BNTzzweD8wTYK75V9" target="_blank" rel="noopener">Pontszám beküldése az űrlapon</a>
  <div id="review"></div>
  <button class="btn" id="again" style="margin-top:14px">Újrakezdés</button>
</section>
</main>

<script>
// Az első válasz mindig a helyes; futáskor összekeverjük.
var BANK=[
["Igaz-e, hogy 5 ∈ (2;5) ?",["Nem, mert a jobb végpont nyitott, nem tartozik hozzá","Igen, mert 5 a jobb végpont","Igen, mert 5 > 2","Nem, mert 5 páratlan szám"]],
["Melyik szám eleme a [−2;3) intervallumnak?",["−2","−3","3","4"]],
["Melyik állítás igaz?",["[1;4] ⊂ (0;5)","(0;5) ⊂ [1;4]","[1;4] ⊂ (1;4)","(0;5) ⊂ (1;4)"]],
["Melyik halmaz NEM intervallum?",["{1; 2; 3}","[1;3]","(−∞;0)","(2;7]"]],
["Írd át intervallummá: {x ∈ ℝ | −1 < x ≤ 4}",["(−1;4]","[−1;4]","(−1;4)","[−1;4)"]],
["Írd át halmazjelöléssel: [2;7)",["{x ∈ ℝ | 2 ≤ x < 7}","{x ∈ ℝ | 2 < x ≤ 7}","{x ∈ ℝ | 2 < x < 7}","{x ∈ ℝ | 2 ≤ x ≤ 7}"]],
["Írd át intervallummá: {x ∈ ℝ | x ≥ 3}",["[3;∞)","(3;∞)","(−∞;3]","(−∞;3)"]],
["Hány egész szám van a (−3;4] intervallumban?",["7","6","8","4"]],
["Hány természetes szám van a [−3;3) intervallumban? (ℕ tartalmazza a 0-t)",["3","2","5","6"]],
["Mennyi az (−4;5] intervallum legkisebb és legnagyobb egész elemének összege?",["2","1","−1","0"]]
];
var $=function(i){return document.getElementById(i)};
var name="",qs=[],idx=0,sel=-1,good=0,log=[];

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["start","quiz","end"].forEach(function(s){$(s).hidden=s!==id})}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

$("name").oninput=function(){$("go").disabled=!this.value.trim()};
$("name").onkeydown=function(e){if(e.key==="Enter"&&this.value.trim())start()};
$("go").onclick=start;
$("again").onclick=function(){$("name").value=name;$("go").disabled=false;show("start")};

function start(){
  name=$("name").value.trim();
  qs=shuffle(BANK).map(function(q){
    return {t:q[0],ok:q[1][0],o:shuffle(q[1])};
  });
  idx=0;good=0;log=[];
  $("who").textContent=name;
  show("quiz");render();
}
function render(){
  var q=qs[idx];sel=-1;
  $("cnt").textContent=(idx+1)+" / "+qs.length;
  $("prog").style.width=(idx/qs.length*100)+"%";
  $("qt").textContent=q.t;
  $("next").disabled=true;
  $("next").textContent=idx===qs.length-1?"Befejezés":"Következő";
  $("opts").innerHTML="";
  q.o.forEach(function(o,i){
    var b=document.createElement("button");
    b.className="opt";b.textContent=o;
    b.onclick=function(){
      sel=i;
      Array.prototype.forEach.call($("opts").children,function(c,k){c.className="opt"+(k===i?" sel":"")});
      $("next").disabled=false;
    };
    $("opts").appendChild(b);
  });
}
$("next").onclick=function(){
  var q=qs[idx],ans=q.o[sel],right=ans===q.ok;
  if(right)good++;
  log.push({t:q.t,ans:ans,ok:q.ok,right:right});
  idx++;
  if(idx<qs.length)render();else finish();
};
function finish(){
  var n=qs.length;
  $("endname").textContent="Kész, "+name+"!";
  $("score").textContent=good+" / "+n;
  $("good").textContent=good;
  $("wrong").textContent=n-good;
  var h="";
  log.forEach(function(l,i){
    if(!l.right)h+='<div class="rev"><b>'+(i+1)+". "+esc(l.t)+'</b><br><span class="bad">Te: '+esc(l.ans)+'</span><br><span class="ok">Helyes: '+esc(l.ok)+"</span></div>";
  });
  $("review").innerHTML=h?"<p style='margin-top:14px'>Hibás válaszaid:</p>"+h:"<p style='margin-top:14px'>Hibátlan! 🎉</p>";
  show("end");
}
</script>
</body>
</html>
